name: Publish

on:
  workflow_dispatch:
    inputs:
      formula:
        description: Formula to publish
        required: true
        type: choice
        options:
          - advent-of-code
          - googlesql-execute-query
          - luau-lsp
      version:
        description: Version to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  # Shared with the scheduled workflow, as both push to the default branch.
  group: update-formulas

jobs:
  publish:
    name: Publish ${{ inputs.formula }} ${{ inputs.version }}
    runs-on: ubuntu-latest
    env:
      FORMULA: ${{ inputs.formula }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Regenerate formula
        run: scripts/regenerate.py "$FORMULA" "$VERSION"
      - name: Commit and push
        run: scripts/commit-and-push.sh "Bump $FORMULA to $VERSION"
