name: Scheduled

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Shared with the publish workflow, as both push to the default branch.
  group: update-formulas

jobs:
  update:
    name: Update formulas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Update formulas to the latest releases
        run: scripts/check-update.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit and push
        run: scripts/commit-and-push.sh "Update formulas from scheduled job"
